<svg viewBox="0 0 500 500" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="woodBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5C3A21"/>
      <stop offset="50%" stop-color="#4A2C17"/>
      <stop offset="100%" stop-color="#3A2110"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8C376"/>
      <stop offset="50%" stop-color="#C9932C"/>
      <stop offset="100%" stop-color="#A87423"/>
    </linearGradient>
    <linearGradient id="creamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F7EFDD"/>
      <stop offset="100%" stop-color="#E9DBC0"/>
    </linearGradient>
    <filter id="softShadow" x="-20%" y="-20%" width="140%" height="140%">
      <feDropShadow dx="0" dy="3" stdDeviation="4" flood-color="#000000" flood-opacity="0.35"/>
    </filter>
  </defs>

  <!-- Outer wood plank plaque -->
  <rect x="20" y="20" width="460" height="460" rx="36" fill="url(#woodBg)" filter="url(#softShadow)"/>

  <!-- subtle wood grain lines -->
  <g stroke="#2E1A0D" stroke-width="1.4" fill="none" opacity="0.35">
    <path d="M40 90 C 150 70, 350 110, 460 85"/>
    <path d="M35 140 C 160 165, 330 120, 465 150"/>
    <path d="M35 360 C 160 335, 330 385, 465 355"/>
    <path d="M40 410 C 150 430, 350 395, 460 420"/>
  </g>
  <g stroke="#6B4A2B" stroke-width="1" fill="none" opacity="0.4">
    <path d="M35 110 C 160 95, 330 130, 465 105"/>
    <path d="M35 385 C 160 405, 330 370, 465 400"/>
  </g>

  <!-- CNC routed inner groove border -->
  <rect x="46" y="46" width="408" height="408" rx="26" fill="none" stroke="#2E1A0D" stroke-width="3" opacity="0.6"/>
  <rect x="56" y="56" width="388" height="388" rx="22" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>

  <!-- corner rosette accents (routed detail) -->
  <g fill="url(#goldGrad)" opacity="0.9">
    <circle cx="56" cy="56" r="6"/>
    <circle cx="444" cy="56" r="6"/>
    <circle cx="56" cy="444" r="6"/>
    <circle cx="444" cy="444" r="6"/>
  </g>

  <!-- Monogram shadow (engraved depth) -->
  <text x="250" y="256" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="188" fill="#241207" opacity="0.55" letter-spacing="-4">HS</text>
  <!-- Monogram main -->
  <text x="248" y="252" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="188" fill="url(#creamGrad)" letter-spacing="-4" stroke="url(#goldGrad)" stroke-width="1.5">HS</text>

  <!-- divider flourish -->
  <g stroke="url(#goldGrad)" stroke-width="2.5" stroke-linecap="round">
    <line x1="140" y1="330" x2="210" y2="330"/>
    <line x1="290" y1="330" x2="360" y2="330"/>
  </g>
  <circle cx="250" cy="330" r="5" fill="url(#goldGrad)"/>

  <!-- Tagline -->
  <text x="250" y="378" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="url(#creamGrad)" letter-spacing="6">CNC WOOD CARVING</text>
</svg>
