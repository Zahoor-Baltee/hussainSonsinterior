<svg viewBox="0 0 1000 260" xmlns="http://www.w3.org/2000/svg" xmlns:c2pa="http://c2pa.org/manifest"><metadata><c2pa:manifest></c2pa:manifest></metadata>
  <defs>
    <linearGradient id="woodBg" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#5C3A21"/>
      <stop offset="50%" stop-color="#4A2C17"/>
      <stop offset="100%" stop-color="#3A2110"/>
    </linearGradient>
    <linearGradient id="goldGrad" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#E8C376"/>
      <stop offset="50%" stop-color="#C9932C"/>
      <stop offset="100%" stop-color="#A87423"/>
    </linearGradient>
    <linearGradient id="creamGrad" x1="0%" y1="0%" x2="0%" y2="100%">
      <stop offset="0%" stop-color="#F7EFDD"/>
      <stop offset="100%" stop-color="#E9DBC0"/>
    </linearGradient>
  </defs>

  <!-- ===== Emblem (left) ===== -->
  <g>
    <rect x="20" y="20" width="220" height="220" rx="22" fill="url(#woodBg)"/>
    <g stroke="#2E1A0D" stroke-width="1" fill="none" opacity="0.3">
      <path d="M32 70 C 90 60, 170 82, 228 68"/>
      <path d="M32 190 C 90 202, 170 178, 228 194"/>
    </g>
    <rect x="30" y="30" width="200" height="200" rx="16" fill="none" stroke="url(#goldGrad)" stroke-width="3"/>
    <g fill="url(#goldGrad)" opacity="0.9">
      <circle cx="30" cy="30" r="4.5"/>
      <circle cx="230" cy="30" r="4.5"/>
      <circle cx="30" cy="230" r="4.5"/>
      <circle cx="230" cy="230" r="4.5"/>
    </g>
    <text x="130" y="163" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="108" fill="#241207" opacity="0.5" letter-spacing="-3">HS</text>
    <text x="128" y="160" text-anchor="middle" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="108" fill="url(#creamGrad)" letter-spacing="-3" stroke="url(#goldGrad)" stroke-width="1">HS</text>
  </g>

  <!-- ===== Divider ===== -->
  <line x1="278" y1="45" x2="278" y2="215" stroke="url(#goldGrad)" stroke-width="2.5"/>
  <circle cx="278" cy="130" r="5" fill="url(#goldGrad)"/>

  <!-- ===== Wordmark (right) ===== -->
  <text x="316" y="130" font-family="Georgia, 'Times New Roman', serif" font-weight="700" font-size="66" fill="#3A2110" letter-spacing="0.5">Hussain <tspan fill="url(#goldGrad)" font-style="italic">&amp;</tspan> Sons</text>

  <text x="316" y="196" font-family="Georgia, 'Times New Roman', serif" font-size="27" fill="#A87423" letter-spacing="7">ARCHITECTURAL CNC</text>
</svg>
